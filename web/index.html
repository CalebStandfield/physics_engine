<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Physics Engine // Caleb Standfield</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="rail">
      <div class="rail-left">
        <button class="home" id="btn-home" title="Back to the scenario list">
          <i data-icon="house-simple"></i>
          <span class="name">caleb</span><span>::</span><span class="name">standfield</span>
        </button>
      </div>

      <nav class="tabs hidden" id="tabs"></nav>

      <div class="rail-right">
        <a class="link" href="https://calebstandfield.dev" target="_blank" rel="noreferrer"
           title="Portfolio" aria-label="Portfolio">
          <i data-icon="briefcase"></i>
        </a>
        <a class="link" href="https://github.com/CalebStandfield" target="_blank"
           rel="noreferrer" title="GitHub" aria-label="GitHub">
          <i data-icon="github-logo"></i>
        </a>
        <a class="link" href="https://www.linkedin.com/in/caleb-standfield/" target="_blank"
           rel="noreferrer" title="LinkedIn" aria-label="LinkedIn">
          <i data-icon="linkedin-logo"></i>
        </a>
      </div>
    </header>

    <main class="landing" id="home">
      <div class="landing-inner">
        <section class="title">
          <p class="kicker">rust / webassembly / canvas</p>
          <h1>physics <span>engine</span></h1>
          <p class="tagline">A rigid body sandbox that runs entirely in this tab.</p>

          <ul class="facts">
            <li>engine in wasm</li>
            <li>live forces + free body diagram</li>
          </ul>
        </section>

        <div class="pick">
          <span class="pick-rule"></span>
          <span class="pick-label">select a scenario</span>
          <span class="pick-rule"></span>
        </div>

        <div class="cards" id="cards"></div>
      </div>
    </main>

    <main class="stage hidden" id="stage">
      <canvas id="scene"></canvas>

      <div class="transport">
        <button class="btn primary" id="btn-start">
          <i data-icon="play"></i>Start
        </button>
        <button class="btn" id="btn-stop"><i data-icon="stop"></i>Stop</button>
        <button class="btn" id="btn-reset">
          <i data-icon="arrow-counter-clockwise"></i>Reset
        </button>
      </div>

      <section class="panel panel-controls" id="panel-controls">
        <div class="mode" id="mode-controls"></div>
        <h2>Controls</h2>
        <div id="controls"></div>
        <div id="solver-block">
          <div class="divider"></div>
          <h2>Solver</h2>
          <div id="solver"></div>
        </div>
      </section>

      <div class="col-right">
        <section class="panel panel-legend">
          <h2>Legend</h2>
          <div id="legend"></div>
        </section>

        <section class="panel panel-fbd" id="panel-fbd">
          <div class="mode" id="mode-fbd"></div>
          <h2>Free body diagram</h2>
          <canvas id="fbd"></canvas>
          <div class="divider"></div>
          <h2>Readout</h2>
          <div class="rows" id="readout"></div>
        </section>
      </div>

      <p class="caption" id="caption"></p>
    </main>

    <div class="boot" id="boot">
      <div>
        loading engine...<br />
        <small>if this sticks, run <code>./run.sh</code> from the project root</small>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
