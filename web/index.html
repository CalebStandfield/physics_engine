<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Physics Engine // Caleb Standfield</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="rail">
      <div class="rail-left">
        <!-- TODO: point at your portfolio root -->
        <a class="home" href="https://example.com" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>
          <span class="name">caleb</span><span>::</span><span class="name">standfield</span>
        </a>
      </div>

      <nav class="tabs" id="tabs"></nav>

      <div class="rail-right">
        <!-- TODO: your portfolio URL -->
        <a class="link" href="https://example.com" target="_blank" rel="noreferrer">portfolio</a>
        <!-- TODO: your LinkedIn URL -->
        <a class="link" href="https://www.linkedin.com/" target="_blank" rel="noreferrer">linkedin</a>
        <a class="link" href="https://github.com/CalebStandfield" target="_blank" rel="noreferrer">github</a>
      </div>
    </header>

    <main class="stage">
      <canvas id="scene"></canvas>

      <div class="transport">
        <button class="btn primary" id="btn-start">Start</button>
        <button class="btn" id="btn-stop">Stop</button>
        <button class="btn" id="btn-reset">Reset</button>
      </div>

      <section class="panel panel-controls">
        <h2>Controls</h2>
        <div id="controls"></div>
        <div class="divider"></div>
        <h2>Solver</h2>
        <div id="solver"></div>
      </section>

      <div class="col-right">
        <section class="panel panel-legend">
          <h2>Legend</h2>
          <div id="legend"></div>
        </section>

        <section class="panel panel-fbd">
          <h2>Free body diagram</h2>
          <canvas id="fbd"></canvas>
          <div class="divider"></div>
          <h2>Readout</h2>
          <div class="rows" id="readout"></div>
        </section>
      </div>

      <p class="caption" id="caption"></p>
    </main>

    <div class="boot" id="boot">
      <div>
        loading engine...<br />
        <small>if this sticks, run <code>./run.sh</code> from the project root</small>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
